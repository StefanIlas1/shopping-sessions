[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
memchr = "2"
memmap2 = "0.9"
parquet = { version = "57.3", default-features = false }
rayon = "1.11"
rustc-hash = "2"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
